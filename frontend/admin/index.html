<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cosmic AI</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.admin-layout {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 240px;
  background: var(--text);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 50;
  overflow-y: auto;
}
.admin-main {
  margin-left: 240px;
  flex: 1;
  padding: 32px;
  min-height: 100vh;
  background: var(--bg2);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 24px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: rgba(255,255,255,0.6);
  transition: all 0.2s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: 'DM Sans', sans-serif;
  border-left: 3px solid transparent;
}
.nav-item:hover {
  color: white;
  background: rgba(255,255,255,0.06);
}
.nav-item.active {
  color: white;
  background: rgba(108,99,255,0.2);
  border-left-color: var(--accent);
}
.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  box-shadow: var(--shadow);
}
.stat-value {
  font-size: 30px;
  font-weight: 800;
  font-family: 'Playfair Display', serif;
  margin-bottom: 4px;
}
.section-header {
  margin-bottom: 28px;
}
.section-header h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  font-family: 'Playfair Display', serif;
}
.section-header p {
  font-size: 14px;
  color: var(--text2);
}
.payment-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.screenshot-img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.screenshot-img:hover {
  transform: scale(1.05);
  box-shadow: var(--shadow2);
}
.screenshot-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.screenshot-modal.open {
  display: flex;
}
.screenshot-modal img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 12px;
  object-fit: contain;
}
@media(max-width:768px) {
  .sidebar {
    width: 100%;
    height: auto;
    position: relative;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 8px;
  }
  .admin-main {
    margin-left: 0;
    padding: 16px;
  }
  .nav-item {
    padding: 10px 12px;
    font-size: 12px;
    border-left: none;
    border-bottom: 3px solid transparent;
    flex: 1;
    justify-content: center;
  }
  .nav-item.active {
    border-left-color: transparent;
    border-bottom-color: var(--accent);
  }
}
</style>
</head>
<body>

<!-- Screenshot Modal -->
<div class="screenshot-modal" id="screenshotModal" onclick="closeScreenshot()">
  <img id="screenshotModalImg" src="" alt="Payment Screenshot">
</div>

<!-- Login Screen -->
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2)">
  <div style="width:90%;max-width:400px">
    <div style="text-align:center;margin-bottom:40px">
      <div class="logo-icon" style="margin:0 auto 16px;width:52px;height:52px;font-size:24px">C</div>
      <h2 class="serif" style="font-size:26px;font-weight:700;color:var(--text);margin-bottom:8px">Admin Panel</h2>
      <p style="font-size:14px;color:var(--text2)">Cosmic AI — Restricted Access Only</p>
    </div>
    <div class="card-flat">
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <button onclick="adminLogin()" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;justify-content:center">
        Login to Admin Panel
      </button>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" style="display:none">
  <div class="admin-layout">

    <div class="sidebar">
      <div style="padding:24px 24px 16px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="logo-icon" style="width:32px;height:32px;font-size:16px;flex-shrink:0">C</div>
          <div>
            <div style="color:white;font-size:15px;font-weight:700;font-family:'Playfair Display',serif">Cosmic AI</div>
            <div style="color:rgba(255,255,255,0.4);font-size:11px">Admin Panel</div>
          </div>
        </div>
      </div>

      <div style="height:1px;background:rgba(255,255,255,0.08);margin:0 16px 8px"></div>

      <nav style="flex:1;padding:4px 0">
        <button class="nav-item active" onclick="showSection('dashboard',this)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </button>
        <button class="nav-item" onclick="showSection('payments',this)" id="navPayments">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
          Payment Requests
          <span id="pendingBadge" style="display:none;background:var(--accent2);color:white;font-size:10px;padding:2px 7px;border-radius:20px;margin-left:auto"></span>
        </button>
        <button class="nav-item" onclick="showSection('pdfs',this)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          Manage PDFs
        </button>
        <button class="nav-item" onclick="showSection('students',this)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Students
        </button>
        <button class="nav-item" onclick="showSection('revenue',this)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6"/></svg>
          Revenue
        </button>
        <button class="nav-item" onclick="showSection('settings',this)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </button>
      </nav>

      <div style="padding:16px;border-top:1px solid rgba(255,255,255,0.08)">
        <button onclick="adminLogout()" style="width:100%;padding:10px;background:rgba(255,101,132,0.15);border:1px solid rgba(255,101,132,0.3);border-radius:8px;color:#ff6584;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">
          Sign Out
        </button>
      </div>
    </div>

    <div class="admin-main" id="adminContent"></div>

  </div>
</div>

<!-- Approve Modal -->
<div class="modal" id="approveModal">
  <div class="modal-box">
    <h3 class="serif" style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px">Approve Payment</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:20px">Select access duration for this student</p>
    <input type="hidden" id="approveId">
    <div class="form-group">
      <label>Access Duration</label>
      <select id="approveDuration" onchange="toggleCustom(this.value)">
        <option value="30">30 Days</option>
        <option value="60">60 Days</option>
        <option value="90">90 Days</option>
        <option value="180">180 Days — 6 Months</option>
        <option value="365">365 Days — 1 Year</option>
        <option value="custom">Custom Days</option>
      </select>
    </div>
    <div class="form-group" id="customGroup" style="display:none">
      <label>Custom Days</label>
      <input type="number" id="customDays" placeholder="Enter number of days" min="1">
    </div>
    <div style="display:flex;gap:12px">
      <button onclick="confirmApprove()" class="btn btn-success" style="flex:1;padding:12px;justify-content:center">Approve Access</button>
      <button onclick="closeModal()" class="btn btn-ghost" style="flex:1;padding:12px;justify-content:center">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminToken = localStorage.getItem('cosmicAdminToken');

window.onload = () => {
  if (adminToken) {
    showAdminPanel();
    renderDashboard();
    loadPendingCount();
  }
};

function toggleCustom(val) {
  document.getElementById('customGroup').style.display = val === 'custom' ? 'block' : 'none';
}

async function loadPendingCount() {
  try {
    const res = await fetch('/api/admin/payments/pending', {
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    const data = await res.json();
    const count = data.payments?.length || 0;
    const badge = document.getElementById('pendingBadge');
    if (count > 0) {
      badge.textContent = count;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  } catch {}
}

async function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  if (!pass) { showToast('Enter password'); return; }
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (data.success) {
      adminToken = data.token;
      localStorage.setItem('cosmicAdminToken', adminToken);
      showAdminPanel();
      renderDashboard();
      loadPendingCount();
    } else {
      showToast('Wrong password');
    }
  } catch {
    showToast('Server error');
  }
}

function adminLogout() {
  localStorage.removeItem('cosmicAdminToken');
  adminToken = null;
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showAdminPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
}

function showSection(section, btn) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (section === 'dashboard') renderDashboard();
  else if (section === 'payments') renderPayments();
  else if (section === 'pdfs') renderPDFs();
  else if (section === 'students') renderStudents();
  else if (section === 'revenue') renderRevenue();
  else if (section === 'settings') renderSettings();
}

function viewScreenshot(path) {
  document.getElementById('screenshotModalImg').src = path;
  document.getElementById('screenshotModal').classList.add('open');
}

function closeScreenshot() {
  document.getElementById('screenshotModal').classList.remove('open');
}

async function renderDashboard() {
  const c = document.getElementById('adminContent');
  c.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text2)">Loading...</div>`;
  try {
    const res = await fetch('/api/admin/dashboard', {
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    const data = await res.json();
    const s = data.stats;
    c.innerHTML = `
      <div class="section-header">
        <h1>Dashboard</h1>
        <p>Overview of Cosmic AI platform</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px">
        <div class="stat-card" style="border-top:3px solid var(--accent3)">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Total Revenue</div>
          <div class="stat-value" style="color:var(--accent3)">Rs.${s.totalRevenue || 0}</div>
        </div>
        <div class="stat-card" style="border-top:3px solid var(--accent)">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Total Students</div>
          <div class="stat-value" style="color:var(--accent)">${s.totalStudents || 0}</div>
        </div>
        <div class="stat-card" style="border-top:3px solid var(--accent2)">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Pending Requests</div>
          <div class="stat-value" style="color:var(--accent2)">${s.pendingRequests || 0}</div>
        </div>
        <div class="stat-card" style="border-top:3px solid #d97706">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Total PDFs</div>
          <div class="stat-value" style="color:#d97706">${s.totalPdfs || 0}</div>
        </div>
        <div class="stat-card" style="border-top:3px solid var(--accent3)">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Active Access</div>
          <div class="stat-value" style="color:var(--accent3)">${s.activePurchases || 0}</div>
        </div>
        <div class="stat-card" style="border-top:3px solid var(--accent)">
          <div style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Total Sales</div>
          <div class="stat-value" style="color:var(--accent)">${s.totalSales || 0}</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap">
        <div class="card-flat" style="background:white">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h2 style="font-size:16px;font-weight:700;color:var(--text)">Recent Payments</h2>
            <button onclick="showSection('payments')" class="btn btn-ghost" style="padding:6px 14px;font-size:12px">View All</button>
          </div>
          ${data.recentPayments && data.recentPayments.length > 0 ? `
            <div style="display:flex;flex-direction:column;gap:12px">
              ${data.recentPayments.map(p => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg2);border-radius:10px">
                  <div>
                    <div style="font-weight:600;font-size:14px;color:var(--text)">${p.user_name || 'Unknown'}</div>
                    <div style="font-size:12px;color:var(--text2)">${p.pdf_title || 'Unknown PDF'}</div>
                  </div>
                  <div style="text-align:right">
                    <div style="font-weight:700;color:var(--accent2);font-size:14px">Rs.${p.amount || 0}</div>
                    <span class="badge ${p.status === 'approved' ? 'badge-green' : p.status === 'pending' ? 'badge-yellow' : 'badge-red'}" style="font-size:11px">
                      ${p.status === 'approved' ? 'Approved' : p.status === 'pending' ? 'Pending' : 'Rejected'}
                    </span>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `<div style="text-align:center;padding:32px;color:var(--text2)">No payments yet</div>`}
        </div>

        <div class="card-flat" style="background:white">
          <h2 style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:20px">Revenue by Subject</h2>
          ${Object.keys(data.revenueBySubject || {}).length > 0 ?
            Object.entries(data.revenueBySubject).map(([sub, amt]) => `
              <div style="margin-bottom:16px">
                <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                  <span style="font-size:13px;color:var(--text);font-weight:500">${sub}</span>
                  <span style="font-size:13px;font-weight:700;color:var(--accent2)">Rs.${amt}</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width:${Math.min(100,(amt/Math.max(...Object.values(data.revenueBySubject)))*100)}%"></div>
                </div>
              </div>
            `).join('')
          : `<div style="text-align:center;padding:32px;color:var(--text2)">No revenue data yet</div>`}
        </div>
      </div>
    `;
  } catch {
    c.innerHTML = `<div style="text-align:center;padding:60px;color:var(--accent2)">Failed to load dashboard</div>`;
  }
}

async function renderPayments() {
  const c = document.getElementById('adminContent');
  c.innerHTML = `
    <div class="section-header">
      <h1>Payment Requests</h1>
      <p>Review and approve student payments</p>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:24px">
      <button onclick="loadPayments('pending')" class="btn btn-primary" id="btnPending">Pending</button>
      <button onclick="loadPayments('all')" class="btn btn-ghost" id="btnAll">All Payments</button>
    </div>
    <div id="paymentsList"></div>
  `;
  loadPayments('pending');
}

async function loadPayments(type) {
  const list = document.getElementById('paymentsList');
  list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text2)">Loading...</div>`;
  try {
    const url = type === 'pending' ? '/api/admin/payments/pending' : '/api/admin/payments/all';
    const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + adminToken } });
    const data = await res.json();

    if (!data.payments || data.payments.length === 0) {
      list.innerHTML = `
        <div style="text-align:center;padding:60px;border:1px dashed var(--border);border-radius:16px;background:white">
          <p style="color:var(--text2);font-size:15px">No ${type === 'pending' ? 'pending' : ''} payments</p>
        </div>
      `;
      return;
    }

    list.innerHTML = data.payments.map(p => `
      <div class="payment-card">
        <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:20px">

          <div style="flex:1;min-width:200px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
              <div style="width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:16px;flex-shrink:0">
                ${(p.user_name || 'U')[0].toUpperCase()}
              </div>
              <div>
                <div style="font-weight:700;color:var(--text);font-size:15px">${p.user_name || 'Unknown Student'}</div>
                <div style="font-size:12px;color:var(--text2)">${p.user_email || 'No email'}</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
              <div style="background:var(--bg2);padding:10px;border-radius:8px">
                <div style="font-size:11px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px">PDF</div>
                <div style="font-size:13px;font-weight:600;color:var(--text)">${p.pdf_title || 'Unknown PDF'}</div>
              </div>
              <div style="background:var(--bg2);padding:10px;border-radius:8px">
                <div style="font-size:11px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px">Board</div>
                <div style="font-size:13px;font-weight:600;color:var(--text)">${(p.pdf_board || 'N/A').toUpperCase()}</div>
              </div>
              <div style="background:var(--bg2);padding:10px;border-radius:8px">
                <div style="font-size:11px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px">Amount</div>
                <div style="font-size:15px;font-weight:800;color:var(--accent2)">Rs.${p.amount || 0}</div>
              </div>
              <div style="background:var(--bg2);padding:10px;border-radius:8px">
                <div style="font-size:11px;color:var(--text2);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px">Date</div>
                <div style="font-size:13px;font-weight:600;color:var(--text)">${p.submitted_at ? new Date(p.submitted_at).toLocaleDateString('en-IN') : 'N/A'}</div>
              </div>
            </div>

            <span class="badge ${p.status === 'approved' ? 'badge-green' : p.status === 'pending' ? 'badge-yellow' : 'badge-red'}">
              ${p.status === 'approved' ? 'Approved' : p.status === 'pending' ? 'Pending Verification' : 'Rejected'}
            </span>
          </div>

          <div style="text-align:center;flex-shrink:0">
            <div style="font-size:12px;color:var(--text2);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Payment Screenshot</div>
            ${p.screenshot_path ? `
              <img
                src="${p.screenshot_path}"
                class="screenshot-img"
                onclick="viewScreenshot('${p.screenshot_path}')"
                alt="Payment Screenshot"
                onerror="this.parentElement.innerHTML='<div style=padding:20px;color:var(--text2);font-size:12px;text-align:center;background:var(--bg2);border-radius:10px;border:1px solid var(--border);width:120px>Screenshot not found</div>'"
              >
              <div style="font-size:11px;color:var(--accent);margin-top:6px;cursor:pointer" onclick="viewScreenshot('${p.screenshot_path}')">Click to enlarge</div>
            ` : `
              <div style="width:120px;height:120px;background:var(--bg2);border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);text-align:center;padding:10px">
                No screenshot
              </div>
            `}
          </div>
        </div>

        ${p.status === 'pending' ? `
          <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
            <button onclick="openApproveModal('${p.id}')" class="btn btn-success" style="flex:1;padding:12px;justify-content:center">
              Approve and Give Access
            </button>
            <button onclick="rejectPayment('${p.id}')" class="btn btn-danger" style="padding:12px 24px">
              Reject
            </button>
          </div>
        ` : ''}
      </div>
    `).join('');
  } catch {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--accent2)">Failed to load payments</div>`;
  }
}

function openApproveModal(id) {
  document.getElementById('approveId').value = id;
  document.getElementById('approveModal').classList.add('open');
}

function closeModal() {
  document.getElementById('approveModal').classList.remove('open');
}

async function confirmApprove() {
  const id = document.getElementById('approveId').value;
  const sel = document.getElementById('approveDuration').value;
  const duration = sel === 'custom'
    ? parseInt(document.getElementById('customDays').value)
    : parseInt(sel);
  if (!duration || duration < 1) { showToast('Enter valid duration'); return; }
  try {
    const res = await fetch('/api/admin/payments/' + id + '/approve', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ durationDays: duration })
    });
    const data = await res.json();
    if (data.success) {
      closeModal();
      showToast('Payment approved. Student can now access PDF.');
      loadPayments('pending');
      loadPendingCount();
    } else {
      showToast(data.error || 'Failed');
    }
  } catch {
    showToast('Network error');
  }
}

async function rejectPayment(id) {
  if (!confirm('Reject this payment?')) return;
  try {
    const res = await fetch('/api/admin/payments/' + id + '/reject', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken }
    });
    const data = await res.json();
    if (data.success) {
      showToast('Payment rejected');
      loadPayments('pending');
      loadPendingCount();
    }
  } catch { showToast('Network error'); }
}

async function uploadPDF() {
  const title = document.getElementById('pdfTitle').value;
  const board = document.getElementById('pdfBoard').value;
  const subject = document.getElementById('pdfSubject').value;
  const price = document.getElementById('pdfPrice').value;
  const duration = document.getElementById('pdfDuration').value;
  const desc = document.getElementById('pdfDesc').value;
  const file = document.getElementById('pdfFile').files[0];
  if (!title || !board || !subject || !price || !file) {
    showToast('Fill all required fields');
    return;
  }
  const formData = new FormData();
  formData.append('title', title);
  formData.append('board', board);
  formData.append('subject', subject);
  formData.append('price', price);
  formData.append('durationDays', duration);
  formData.append('description', desc);
  formData.append('pdf', file);
  showToast('Uploading PDF...');
  try {
    const res = await fetch('/api/admin/pdfs/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken },
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      showToast('PDF uploaded successfully');
      loadPDFList();
      document.getElementById('pdfTitle').value = '';
      document.getElementById('pdfSubject').value = '';
      document.getElementById('pdfPrice').value = '';
      document.getElementById('pdfDesc').value = '';
      document.getElementById('fileName').textContent = '';
    } else {
      showToast(data.error || 'Upload failed');
    }
  } catch { showToast('Upload failed'); }
}

}

async function saveUPI() {
  const upiId = document.getElementById('upiId').value;
  const upiName = document.getElementById('upiName').value;
  const qrCode = document.getElementById('qrCode').value;
  if (!upiId || !upiName) { showToast('Enter UPI ID and Name'); return; }
  try {
    const res = await fetch('/api/admin/settings/upi', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ upiId, upiName, qrCode })
    });
    const data = await res.json();
    if (data.success) showToast('UPI settings saved. Update .env and restart server.');
    else showToast(data.error || 'Failed');
  } catch { showToast('Network error'); }
}

async function changePassword() {
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  if (!oldPass || !newPass) { showToast('Fill all fields'); return; }
  if (newPass !== confirmPass) { showToast('Passwords do not match'); return; }
  if (newPass.length < 6) { showToast('Password must be 6 or more characters'); return; }
  try {
    const res = await fetch('/api/admin/settings/password', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldPassword: oldPass, newPassword: newPass })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Update ADMIN_PASSWORD in .env and restart server');
      document.getElementById('oldPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
    } else {
      showToast(data.error || 'Failed');
    }
  } catch { showToast('Network error'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}
