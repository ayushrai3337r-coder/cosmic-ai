<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Cosmic AI</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">
    <div class="logo-icon">C</div>
    Cosmic AI
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost hide-mobile" onclick="window.location.href='/pages/history.html'">My Purchases</button>
    <img id="userAvatar" src="" class="user-avatar" onclick="openSidePanel()" onerror="this.style.display='none';document.getElementById('avatarFallback').style.display='flex'">
    <div id="avatarFallback" style="display:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));align-items:center;justify-content:center;font-weight:700;color:white;font-size:14px;cursor:pointer" onclick="openSidePanel()"></div>
  </div>
</nav>

<div class="overlay" id="overlay" onclick="closeSidePanel()"></div>

<div class="side-panel" id="sidePanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)">
    <span style="font-size:16px;font-weight:600;color:var(--white)">My Account</span>
    <button onclick="closeSidePanel()" style="background:none;border:none;color:var(--text2);font-size:24px;cursor:pointer;line-height:1">x</button>
  </div>
  <div id="sidePanelContent" style="flex:1"></div>
</div>

<main style="padding-top:64px">
  <div style="max-width:1100px;margin:0 auto;padding:40px 24px">

    <div style="margin-bottom:40px">
      <h1 class="serif" style="font-size:clamp(24px,4vw,36px);font-weight:700;color:var(--white);margin-bottom:8px" id="greeting">Good Morning</h1>
      <p style="font-size:15px;color:var(--text2)">What would you like to study today?</p>
    </div>

    <div id="activeMaterials"></div>

    <div style="margin-bottom:32px">
      <h2 style="font-size:20px;font-weight:700;color:var(--white);margin-bottom:8px">Explore Boards</h2>
      <p style="font-size:14px;color:var(--text2);margin-bottom:20px">Select a board to browse available study materials</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="board-chip" id="chip-ssc" onclick="loadBoard('ssc',this)">SSC Board</button>
        <button class="board-chip" id="chip-msbte" onclick="loadBoard('msbte',this)">MSBTE Board</button>
        <button class="board-chip" id="chip-cbse" onclick="loadBoard('cbse',this)">CBSE Board</button>
      </div>
    </div>

    <div id="pdfSection">
      <div style="text-align:center;padding:80px 20px;border:1px dashed var(--border);border-radius:16px">
        <div style="width:64px;height:64px;background:var(--bg3);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
          <svg width="28" height="28" fill="none" stroke="var(--text2)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <p style="font-size:15px;color:var(--text2)">Select a board above to browse study materials</p>
      </div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const token = localStorage.getItem('cosmicToken');
const user = JSON.parse(localStorage.getItem('cosmicUser') || '{}');

if (!token) window.location.href = '/pages/login.html';

window.onload = () => {
  setGreeting();
  setUserUI();
  loadActiveMaterials();
};

function setGreeting() {
  const h = new Date().getHours();
  const name = user.name?.split(' ')[0] || 'Student';
  const greet = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
  document.getElementById('greeting').textContent = greet + ', ' + name;
}

function setUserUI() {
  const avatar = document.getElementById('userAvatar');
  const fallback = document.getElementById('avatarFallback');
  if (user.picture) {
    avatar.src = user.picture;
  } else {
    avatar.style.display = 'none';
    fallback.style.display = 'flex';
    fallback.textContent = (user.name || 'U')[0].toUpperCase();
  }
}

function openSidePanel() {
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('overlay').style.display = 'block';
  renderSidePanel();
}

function closeSidePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('overlay').style.display = 'none';
}

async function renderSidePanel() {
  const content = document.getElementById('sidePanelContent');
  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:16px;background:var(--bg3);border-radius:12px;border:1px solid var(--border)">
      <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:16px;flex-shrink:0">${(user.name||'U')[0].toUpperCase()}</div>
      <div>
        <div style="font-weight:600;font-size:15px;color:var(--white)">${user.name}</div>
        <div style="font-size:12px;color:var(--text2)">${user.email}</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:24px">
      <button onclick="closeSidePanel()" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;text-align:left;width:100%;color:var(--text);font-family:'DM Sans',sans-serif;transition:background 0.2s" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='none'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Dashboard
      </button>
      <button onclick="window.location.href='/pages/history.html'" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:500;text-align:left;width:100%;color:var(--text);font-family:'DM Sans',sans-serif;transition:background 0.2s" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='none'">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Purchase History
      </button>
    </div>

    <div style="margin-bottom:24px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">Active Materials</div>
      <div id="sideActiveMaterials">
        <div style="text-align:center;padding:20px;color:var(--text2);font-size:13px">Loading...</div>
      </div>
    </div>

    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <button onclick="logout()" style="width:100%;padding:12px;background:rgba(255,101,132,0.08);border:1px solid rgba(255,101,132,0.2);border-radius:10px;color:var(--accent2);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sign Out
      </button>
    </div>
  `;

  try {
    const res = await fetch('/api/payments/my-purchases', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    const el = document.getElementById('sideActiveMaterials');
    if (data.purchases && data.purchases.length > 0) {
      el.innerHTML = data.purchases.map(p => `
        <div style="padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="window.location.href='/pages/viewer.html?id=${p.id}&title=${encodeURIComponent(p.title)}&file=${encodeURIComponent(p.filePath)}'">
          <div style="font-size:13px;font-weight:600;color:var(--white);margin-bottom:4px">${p.title}</div>
          <div style="font-size:11px;color:var(--text2)">Expires: ${new Date(p.expiryDate).toLocaleDateString('en-IN')}</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${getDaysPercent(p.expiryDate)}%"></div></div>
        </div>
      `).join('');
    } else {
      el.innerHTML = `<div style="text-align:center;padding:20px;border:1px dashed var(--border);border-radius:10px;color:var(--text2);font-size:13px">No active materials</div>`;
    }
  } catch {}
}

function getDaysPercent(expiry) {
  const remaining = Math.max(0, (new Date(expiry) - new Date()) / (1000*60*60*24));
  return Math.min(100, (remaining / 30) * 100);
}

async function loadActiveMaterials() {
  try {
    const res = await fetch('/api/payments/my-purchases', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    const el = document.getElementById('activeMaterials');
    if (!data.purchases || data.purchases.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div style="margin-bottom:40px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
          <h2 style="font-size:20px;font-weight:700;color:var(--white)">Continue Studying</h2>
          <button onclick="window.location.href='/pages/history.html'" style="font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:500">View All</button>
        </div>
        <div class="grid-2">
          ${data.purchases.map(p => `
            <div class="pdf-card" onclick="window.location.href='/pages/viewer.html?id=${p.id}&title=${encodeURIComponent(p.title)}&file=${encodeURIComponent(p.filePath)}'">
              <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:14px">
                <span class="badge badge-purple">${p.board?.toUpperCase()}</span>
                <span style="font-size:11px;color:var(--accent3);font-weight:600">ACTIVE</span>
              </div>
              <h3 style="font-size:16px;font-weight:700;color:var(--white);margin-bottom:8px">${p.title}</h3>
              <div style="font-size:12px;color:var(--text2);margin-bottom:14px">Expires: ${new Date(p.expiryDate).toLocaleDateString('en-IN')}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${getDaysPercent(p.expiryDate)}%"></div></div>
              <button style="margin-top:14px;width:100%;padding:10px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">Open Notes</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch {}
}

async function loadBoard(boardId, btn) {
  document.querySelectorAll('.board-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const section = document.getElementById('pdfSection');
  section.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text2)">Loading...</div>`;
  try {
    const res = await fetch('/api/pdfs/board/' + boardId, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (!data.pdfs || data.pdfs.length === 0) {
      section.innerHTML = `
        <div style="text-align:center;padding:60px;border:1px dashed var(--border);border-radius:16px">
          <p style="color:var(--text2);font-size:15px">No materials available for this board yet</p>
        </div>
      `;
      return;
    }
    section.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:18px;font-weight:700;color:var(--white)">${boardId.toUpperCase()} Study Materials</h2>
        <span style="font-size:13px;color:var(--text2)">${data.pdfs.length} materials</span>
      </div>
      <div class="grid-2">
        ${data.pdfs.map(pdf => `
          <div class="pdf-card">
            <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:14px">
              <span class="badge badge-gray">${pdf.subject || boardId.toUpperCase()}</span>
              ${pdf.hasAccess
                ? '<span class="badge badge-green">Owned</span>'
                : `<span style="font-size:15px;font-weight:800;color:var(--accent2)">Rs.${pdf.price}</span>`
              }
            </div>
            <h3 style="font-size:16px;font-weight:700;color:var(--white);margin-bottom:8px">${pdf.title}</h3>
            <p style="font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6">${pdf.description || 'Important questions and detailed notes for exam preparation.'}</p>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:16px;padding-top:12px;border-top:1px solid var(--border)">
              <span>Access: ${pdf.durationDays} days</span>
              <span>PDF Notes</span>
            </div>
            ${pdf.hasAccess
              ? `<button onclick="window.location.href='/pages/viewer.html?id=${pdf.id}&title=${encodeURIComponent(pdf.title)}&file=${encodeURIComponent(pdf.filePath)}'" style="width:100%;padding:10px;background:var(--accent3);color:#0a2010;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">Open Notes</button>`
              : `<button onclick="window.location.href='/pages/checkout.html?id=${pdf.id}&title=${encodeURIComponent(pdf.title)}&price=${pdf.price}&duration=${pdf.durationDays}'" style="width:100%;padding:10px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">Buy Now</button>`
            }
          </div>
        `).join('')}
      </div>
    `;
  } catch {
    section.innerHTML = `<div style="text-align:center;padding:40px;color:var(--accent2)">Failed to load. Try again.</div>`;
  }
}

function logout() {
  localStorage.removeItem('cosmicToken');
  localStorage.removeItem('cosmicUser');
  window.location.href = '/pages/login.html';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
